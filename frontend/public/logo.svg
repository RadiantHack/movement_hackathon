<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Premium Gradients -->
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accent" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="nodeGlow">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#3B82F6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.6" />
    </radialGradient>
    
    <!-- Filters -->
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="nodeGlowFilter">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Glow Circles -->
  <circle cx="256" cy="256" r="240" fill="url(#primary)" opacity="0.06"/>
  <circle cx="256" cy="256" r="210" fill="url(#cyan)" opacity="0.05"/>
  <circle cx="256" cy="256" r="180" fill="url(#accent)" opacity="0.04"/>
  
  <!-- Outer Ring System -->
  <circle cx="256" cy="256" r="215" stroke="url(#primary)" stroke-width="3" fill="none" opacity="0.3"/>
  <circle cx="256" cy="256" r="205" stroke="url(#cyan)" stroke-width="1.5" fill="none" opacity="0.25" stroke-dasharray="10,8"/>
  <circle cx="256" cy="256" r="195" stroke="url(#accent)" stroke-width="1" fill="none" opacity="0.2" stroke-dasharray="6,6"/>
  
  <!-- Connection Lines to Center -->
  <g opacity="0.5" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)">
    <line x1="256" y1="56" x2="256" y2="165" stroke="url(#primary)"/>
    <line x1="397.7" y1="114.3" x2="306" y2="198" stroke="url(#cyan)"/>
    <line x1="456" y1="256" x2="347" y2="256" stroke="url(#accent)"/>
    <line x1="397.7" y1="397.7" x2="306" y2="314" stroke="url(#primary)"/>
    <line x1="256" y1="456" x2="256" y2="347" stroke="url(#cyan)"/>
    <line x1="114.3" y1="397.7" x2="206" y2="314" stroke="url(#accent)"/>
    <line x1="56" y1="256" x2="165" y2="256" stroke="url(#primary)"/>
    <line x1="114.3" y1="114.3" x2="206" y2="198" stroke="url(#cyan)"/>
  </g>
  
  <!-- 8 Agent Nodes with Icons -->
  <g filter="url(#nodeGlowFilter)">
    <!-- 1. Balance Agent (Top) - Wallet Icon -->
    <circle cx="256" cy="56" r="20" fill="url(#primary)" opacity="0.3"/>
    <circle cx="256" cy="56" r="16" fill="url(#nodeGlow)"/>
    <circle cx="256" cy="56" r="10" fill="url(#primary)"/>
    <path d="M 252 53 L 252 59 M 260 53 L 260 59 M 248 53 L 264 53 L 264 59 L 248 59 Z" 
          stroke="white" stroke-width="1" fill="none"/>
    
    <!-- 2. Swap Agent (Top Right) - Arrows Icon -->
    <circle cx="397.7" cy="114.3" r="20" fill="url(#cyan)" opacity="0.3"/>
    <circle cx="397.7" cy="114.3" r="16" fill="url(#nodeGlow)"/>
    <circle cx="397.7" cy="114.3" r="10" fill="url(#cyan)"/>
    <path d="M 394 111 L 398 111 L 396 109 M 398 111 L 396 113 M 401 118 L 397 118 L 399 116 M 397 118 L 399 120" 
          stroke="white" stroke-width="1" stroke-linecap="round"/>
    
    <!-- 3. Transfer Agent (Right) - Send Icon -->
    <circle cx="456" cy="256" r="20" fill="url(#accent)" opacity="0.3"/>
    <circle cx="456" cy="256" r="16" fill="url(#nodeGlow)"/>
    <circle cx="456" cy="256" r="10" fill="url(#accent)"/>
    <path d="M 452 256 L 460 256 M 460 256 L 457 253 M 460 256 L 457 259" 
          stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    
    <!-- 4. Bridge Agent (Bottom Right) - Bridge Icon -->
    <circle cx="397.7" cy="397.7" r="20" fill="url(#primary)" opacity="0.3"/>
    <circle cx="397.7" cy="397.7" r="16" fill="url(#nodeGlow)"/>
    <circle cx="397.7" cy="397.7" r="10" fill="url(#primary)"/>
    <path d="M 394 401 Q 397.7 395, 401 401 M 394 401 L 394 403 M 401 401 L 401 403" 
          stroke="white" stroke-width="1" stroke-linecap="round" fill="none"/>
    
    <!-- 5. Lending Agent (Bottom) - Coin Stack Icon -->
    <circle cx="256" cy="456" r="20" fill="url(#cyan)" opacity="0.3"/>
    <circle cx="256" cy="456" r="16" fill="url(#nodeGlow)"/>
    <circle cx="256" cy="456" r="10" fill="url(#cyan)"/>
    <ellipse cx="256" cy="454" rx="4" ry="2" fill="white" opacity="0.9"/>
    <ellipse cx="256" cy="456" rx="4" ry="2" fill="white" opacity="0.9"/>
    <ellipse cx="256" cy="458" rx="4" ry="2" fill="white" opacity="0.9"/>
    
    <!-- 6. Premium Agent (Bottom Left) - Star Icon -->
    <circle cx="114.3" cy="397.7" r="20" fill="url(#accent)" opacity="0.3"/>
    <circle cx="114.3" cy="397.7" r="16" fill="url(#nodeGlow)"/>
    <circle cx="114.3" cy="397.7" r="10" fill="url(#accent)"/>
    <path d="M 114.3 394 L 115.5 397 L 118.3 397.7 L 116.3 399.7 L 116.8 402.5 L 114.3 401.2 L 111.8 402.5 L 112.3 399.7 L 110.3 397.7 L 113.1 397 Z" 
          fill="white"/>
    
    <!-- 7. Sentiment Agent (Left) - Chart Icon -->
    <circle cx="56" cy="256" r="20" fill="url(#primary)" opacity="0.3"/>
    <circle cx="56" cy="256" r="16" fill="url(#nodeGlow)"/>
    <circle cx="56" cy="256" r="10" fill="url(#primary)"/>
    <path d="M 52 259 L 54 257 L 56 258 L 58 254 L 60 256" 
          stroke="white" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    
    <!-- 8. Orchestrator Agent (Top Left) - Network Icon -->
    <circle cx="114.3" cy="114.3" r="20" fill="url(#cyan)" opacity="0.3"/>
    <circle cx="114.3" cy="114.3" r="16" fill="url(#nodeGlow)"/>
    <circle cx="114.3" cy="114.3" r="10" fill="url(#cyan)"/>
    <circle cx="114.3" cy="114.3" r="2" fill="white"/>
    <circle cx="110" cy="111" r="1.5" fill="white"/>
    <circle cx="118.6" cy="111" r="1.5" fill="white"/>
    <circle cx="110" cy="117.6" r="1.5" fill="white"/>
    <circle cx="118.6" cy="117.6" r="1.5" fill="white"/>
    <line x1="114.3" y1="114.3" x2="110" y2="111" stroke="white" stroke-width="0.5"/>
    <line x1="114.3" y1="114.3" x2="118.6" y2="111" stroke="white" stroke-width="0.5"/>
    <line x1="114.3" y1="114.3" x2="110" y2="117.6" stroke="white" stroke-width="0.5"/>
    <line x1="114.3" y1="114.3" x2="118.6" y2="117.6" stroke="white" stroke-width="0.5"/>
  </g>
  
  <!-- Agent Labels -->
  <g fill="white" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" opacity="0.8">
    <text x="256" y="40" text-anchor="middle">Balance</text>
    <text x="410" y="108" text-anchor="start">Swap</text>
    <text x="468" y="260" text-anchor="start">Transfer</text>
    <text x="410" y="410" text-anchor="start">Bridge</text>
    <text x="256" y="478" text-anchor="middle">Lending</text>
    <text x="102" y="410" text-anchor="end">Premium</text>
    <text x="44" y="260" text-anchor="end">Sentiment</text>
    <text x="102" y="108" text-anchor="end">Orchestrator</text>
  </g>
  
  <!-- Central Hexagon - Multi-layered -->
  <g filter="url(#shadow)">
    <path d="M 256 160 L 326 200 L 326 312 L 256 352 L 186 312 L 186 200 Z" 
          fill="url(#primary)" opacity="0.2"/>
    <path d="M 256 170 L 318 206 L 318 306 L 256 342 L 194 306 L 194 206 Z" 
          fill="url(#primary)" opacity="0.85" filter="url(#softGlow)"/>
    <path d="M 256 180 L 310 212 L 310 300 L 256 332 L 202 300 L 202 212 Z" 
          fill="url(#cyan)" opacity="0.4"/>
    <path d="M 256 180 L 310 212 L 310 300 L 256 332 L 202 300 L 202 212 Z" 
          stroke="white" stroke-width="2" fill="none" opacity="0.3"/>
  </g>
  
  <!-- Movement "M" - Bold Design -->
  <g filter="url(#softGlow)">
    <path d="M 210 220 L 210 292 M 210 220 L 233 243 L 256 220 L 279 243 L 302 220 M 302 220 L 302 292" 
          stroke="white" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 210 220 L 210 280 M 210 220 L 233 243 L 256 220 L 279 243 L 302 220 M 302 220 L 302 280" 
          stroke="url(#cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Inner Orbital Rings -->
  <g opacity="0.25" stroke-width="1.5" fill="none">
    <circle cx="256" cy="256" r="155" stroke="url(#primary)" stroke-dasharray="8,10"/>
    <circle cx="256" cy="256" r="130" stroke="url(#cyan)" stroke-dasharray="6,8"/>
    <circle cx="256" cy="256" r="105" stroke="url(#accent)" stroke-dasharray="5,6"/>
  </g>
</svg>
