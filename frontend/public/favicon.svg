<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    
    <radialGradient id="favGlow">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:0.5" />
    </radialGradient>
    
    <filter id="favFilter">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="32" cy="32" r="30" fill="url(#favPrimary)" opacity="0.08"/>
  
  <!-- Outer Ring -->
  <circle cx="32" cy="32" r="28" stroke="url(#favPrimary)" stroke-width="1.5" fill="none" opacity="0.3"/>
  
  <!-- 8 Nodes with simplified icons -->
  <g filter="url(#favFilter)">
    <!-- Balance (Top) -->
    <circle cx="32" cy="8" r="3" fill="url(#favPrimary)"/>
    <rect x="31" y="7.5" width="2" height="1" fill="white" opacity="0.9"/>
    
    <!-- Swap (Top Right) -->
    <circle cx="53" cy="16" r="3" fill="url(#favCyan)"/>
    <path d="M 52 15 L 54 15 L 53.5 14.5 M 52 17 L 54 17 L 53.5 17.5" stroke="white" stroke-width="0.5"/>
    
    <!-- Transfer (Right) -->
    <circle cx="56" cy="32" r="3" fill="url(#favPrimary)"/>
    <path d="M 55 32 L 57 32 M 57 32 L 56.5 31.5 M 57 32 L 56.5 32.5" stroke="white" stroke-width="0.5"/>
    
    <!-- Bridge (Bottom Right) -->
    <circle cx="53" cy="48" r="3" fill="url(#favCyan)"/>
    <path d="M 52 49 Q 53 47.5, 54 49" stroke="white" stroke-width="0.5" fill="none"/>
    
    <!-- Lending (Bottom) -->
    <circle cx="32" cy="56" r="3" fill="url(#favPrimary)"/>
    <ellipse cx="32" cy="56" rx="1.5" ry="0.8" fill="white" opacity="0.9"/>
    
    <!-- Premium (Bottom Left) -->
    <circle cx="11" cy="48" r="3" fill="url(#favCyan)"/>
    <path d="M 11 47 L 11.5 48 L 12.5 48.5 L 11.8 49.2 L 12 50.2 L 11 49.7 L 10 50.2 L 10.2 49.2 L 9.5 48.5 L 10.5 48 Z" fill="white"/>
    
    <!-- Sentiment (Left) -->
    <circle cx="8" cy="32" r="3" fill="url(#favPrimary)"/>
    <path d="M 7 33 L 8 32 L 9 32.5 L 10 31" stroke="white" stroke-width="0.5" fill="none"/>
    
    <!-- Orchestrator (Top Left) -->
    <circle cx="11" cy="16" r="3" fill="url(#favCyan)"/>
    <circle cx="11" cy="16" r="0.7" fill="white"/>
    <circle cx="10" cy="15" r="0.4" fill="white"/>
    <circle cx="12" cy="15" r="0.4" fill="white"/>
    <circle cx="10" cy="17" r="0.4" fill="white"/>
    <circle cx="12" cy="17" r="0.4" fill="white"/>
  </g>
  
  <!-- Central Hexagon -->
  <path d="M 32 18 L 44 25 L 44 39 L 32 46 L 20 39 L 20 25 Z" 
        fill="url(#favPrimary)" opacity="0.85" filter="url(#favFilter)"/>
  <path d="M 32 20 L 42 26 L 42 38 L 32 44 L 22 38 L 22 26 Z" 
        fill="url(#favCyan)" opacity="0.3"/>
  
  <!-- M Letter -->
  <g filter="url(#favFilter)">
    <path d="M 24 27 L 24 38 M 24 27 L 28 31 L 32 27 L 36 31 L 40 27 M 40 27 L 40 38" 
          stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
